name: E2E browser capture

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install E2E dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E golden-JSONL test
        working-directory: tests/e2e
        run: npm test

  firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Firefox test driver
        run: pip install camoufox==0.5.9 marionette-driver==3.7.1
      - name: Install Firefox runtime dependencies
        run: python -m playwright install-deps firefox
      - name: Install Camoufox
        run: python -m camoufox fetch
      - name: Test capture and recovery across Firefox restarts
        run: python tests/e2e/firefox-jsonl-test.py
